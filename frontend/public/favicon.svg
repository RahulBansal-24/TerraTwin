<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep space backdrop gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="85%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Earth Gradient (Blue/Cyan/Green) -->
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Mars Gradient (Rust Red/Orange) -->
    <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

    <!-- Moon Gradient (Silver / Pearl Gray) -->
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- Atmosphere Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circular icon base -->
  <circle cx="32" cy="32" r="31" fill="url(#spaceBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Orbital trajectory ring connecting Earth, Moon, Mars -->
  <ellipse cx="32" cy="32" rx="24" ry="11" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.45" transform="rotate(-25 32 32)"/>

  <!-- 1. EARTH (Center-Left) -->
  <g transform="translate(23, 30)">
    <!-- Earth atmosphere aura -->
    <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
    <!-- Earth Globe -->
    <circle cx="0" cy="0" r="13" fill="url(#earthGrad)"/>
    <!-- Earth continents & clouds -->
    <path d="M-6 -7 Q-2 -9 2 -5 Q4 -2 0 3 Q-4 6 -8 2 Z" fill="#10b981" opacity="0.85"/>
    <path d="M-1 4 Q4 3 6 7 Q2 10 -2 8 Z" fill="#10b981" opacity="0.85"/>
    <path d="M-7 -2 Q-3 -4 1 -3 Q-1 0 -6 1 Z" fill="#ffffff" opacity="0.45"/>
    <path d="M0 6 Q5 5 8 8 Q4 10 1 9 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- 2. MARS (Top-Right) -->
  <g transform="translate(46, 19)">
    <!-- Mars atmosphere aura -->
    <circle cx="0" cy="0" r="9.5" fill="#fb923c" opacity="0.25" filter="url(#glow)"/>
    <!-- Mars Globe -->
    <circle cx="0" cy="0" r="8.5" fill="url(#marsGrad)"/>
    <!-- Mars dark albedo surface features & polar cap -->
    <path d="M-3 -4 Q0 -6 4 -4 Q3 -2 -1 -1 Q-4 -2 -3 -4 Z" fill="#9a3412" opacity="0.75"/>
    <path d="M-2 1 Q2 0 4 3 Q0 5 -3 3 Z" fill="#7c2d12" opacity="0.8"/>
    <!-- North polar ice cap -->
    <ellipse cx="0" cy="-6.5" rx="3" ry="1.2" fill="#f8fafc" opacity="0.9"/>
  </g>

  <!-- 3. THE MOON (Bottom-Right, orbiting) -->
  <g transform="translate(42, 45)">
    <!-- Moon Globe -->
    <circle cx="0" cy="0" r="5" fill="url(#moonGrad)"/>
    <!-- Lunar Mare Craters -->
    <circle cx="-1.5" cy="-1.5" r="1.3" fill="#475569" opacity="0.75"/>
    <circle cx="1" cy="0.5" r="1.1" fill="#475569" opacity="0.7"/>
    <circle cx="-0.5" cy="2" r="0.9" fill="#475569" opacity="0.65"/>
  </g>

  <!-- Laser / Scientific Telemetry Vector Ping -->
  <line x1="23" y1="30" x2="46" y2="19" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6"/>
  <circle cx="34.5" cy="24.5" r="1" fill="#ffffff" opacity="0.8"/>
</svg>
